# Weekly dependency checks. Security fixes open pull requests as soon as an
# advisory is published; routine updates are grouped to keep the PR count low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    groups:
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
